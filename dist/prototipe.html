<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Enterprise</title>
<meta name="description" content="Purwarupa antarmuka ERP Enterprise — dasbor, penjualan, pembelian, inventaris, produksi, keuangan, SDM, dan pengaturan.">
<style>
/* ==========================================================================
   ERP Enterprise — Token Desain
   --------------------------------------------------------------------------
   Arah visual diselaraskan dengan FLMS (lab.semestateknologiutama.com):
   Biru primer (#1b4bd6/#3563e9), teal & violet aksen, sidebar navy gelap,
   latar abu-biru terang, radius kartu 12px.

   Struktur tema (WAJIB dipertahankan):
     :root                                   -> palet TERANG lengkap
     @media (prefers-color-scheme: dark)
       :root:not([data-theme="light"])       -> override GELAP untuk OS gelap
     :root[data-theme="dark"]                -> override GELAP untuk pilihan eksplisit
   Tidak ada satu pun warna komponen yang boleh didefinisikan langsung di dalam
   blok media/[data-theme]; komponen selalu memakai token.
   ========================================================================== */

:root {
  /* --- Tangga merek (biru — selaras FLMS) -------------------------------- */
  --brand-50:  #eef4ff;
  --brand-100: #dbe6ff;
  --brand-200: #bcd0ff;
  --brand-300: #8fb0ff;
  --brand-400: #5c86fb;
  --brand-500: #3563e9;
  --brand-600: #1b4bd6;
  --brand-700: #163bad;
  --brand-800: #16338a;
  --brand-900: #172e6e;

  /* --- Permukaan & garis (terang) ---------------------------------------- */
  --canvas:        #f5f7fb;
  --surface:       #ffffff;
  --surface-2:     #f8fafc;
  --surface-3:     #f1f5f9;
  --surface-inset: #eef1f6;
  --overlay-scrim: rgba(11, 17, 32, 0.50);

  --line:        #e3e8f0;
  --line-strong: #cfd7e4;
  --line-faint:  #edf1f5;

  /* --- Tinta (terang) --------------------------------------------------- */
  --ink:    #101a2e;
  --ink-2:  #3d4f66;
  --ink-3:  #5b6b85;
  --ink-4:  #8a99b0;
  --ink-on-brand: #ffffff;

  /* --- Rail / sidebar ---------------------------------------------------- */
  --rail-bg:     #101a2e;
  --rail-fg:     #a9b6cd;
  --rail-fg-hi:  #ffffff;
  --rail-hover:  rgba(255,255,255,.07);
  --rail-active: #1b4bd6;

  /* --- Aksi merek -------------------------------------------------------- */
  --accent:        var(--brand-600);
  --accent-hover:  var(--brand-700);
  --accent-ink:    var(--brand-700);
  --accent-soft:   var(--brand-50);
  --accent-soft-line: var(--brand-200);
  --focus-ring:    #3563e9;

  /* --- Warna aksen sekunder (teal & violet — selaras FLMS) --------------- */
  --teal-100: #d3f4f2;
  --teal-500: #0fa3a3;
  --teal-600: #0b8484;
  --violet-100: #ece6ff;
  --violet-500: #7c3aed;
  --violet-600: #6b28dc;

  /* --- Semantik status --------------------------------------------------- */
  --ok:        #16a34a;
  --ok-soft:   #d9f5e3;
  --ok-line:   #b7dcc5;
  --warn:      #d97706;
  --warn-soft: #fdf0d5;
  --warn-line: #ebd5a6;
  --danger:      #dc2626;
  --danger-soft: #fde3e3;
  --danger-line: #efc4bf;
  --info:      #1b4bd6;
  --info-soft: #eef4ff;
  --info-line: #bcd0ff;
  --neutral-soft: var(--surface-3);
  --neutral-line: var(--line-strong);

  /* --- Palet kategorikal grafik ------------------------------------------ */
  --cat-1: #3563e9;
  --cat-2: #d97706;
  --cat-3: #7c3aed;
  --cat-4: #dc2626;
  --cat-5: #16a34a;

  /* --- Ramp sekuensial --------------------------------------------------- */
  --seq-1: #dbe6ff;
  --seq-2: #8fb0ff;
  --seq-3: #5c86fb;
  --seq-4: #3563e9;
  --seq-5: #1b4bd6;

  /* --- Kromatik grafik pendukung ---------------------------------------- */
  --chart-grid:      #e3e8f0;
  --chart-axis:      #cfd7e4;
  --chart-reference: #8a99b0;
  --chart-surface:   var(--surface);

  /* --- Tipografi (kompak — selaras FLMS) -------------------------------- */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
             system-ui, "Inter", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --fs-micro: 0.625rem;   /* 10px */
  --fs-cap:   0.6875rem;  /* 11px */
  --fs-sm:    0.75rem;    /* 12px */
  --fs-base:  0.8125rem;  /* 13px */
  --fs-lead:  0.875rem;   /* 14px */
  --fs-h3:    1rem;       /* 16px */
  --fs-h2:    1.1875rem;  /* 19px */
  --fs-h1:    1.4375rem;  /* 23px */
  --fs-metric: 1.375rem;  /* 22px */

  --lh-tight: 1.2;
  --lh-snug:  1.35;
  --lh-body:  1.5;
  --ls-micro: 0.08em;
  --ls-tight: -0.015em;

  /* --- Ruang, radius, elevasi ------------------------------------------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;

  /* Radius lebih lembut — diselaraskan dengan FLMS (12px kartu, 9px tombol) */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 12px;
  --r-pill: 999px;

  --shadow-pop:    0 8px 24px rgba(16,26,46,.12), 0 2px 6px rgba(16,26,46,.06);
  --shadow-drawer: -1px 0 0 var(--line), -24px 0 48px rgba(16,26,46,.14);
  --shadow-bar:    0 1px 0 var(--line);

  /* Elevasi melayang — gradasi & bayangan kartu/tombol (FLMS-style) */
  --shadow-card:   0 2px 8px rgba(16,26,46,.06), 0 8px 24px rgba(16,26,46,.08);
  --shadow-card-hover: 0 4px 12px rgba(16,26,46,.10), 0 12px 32px rgba(16,26,46,.12);
  --shadow-btn:    0 2px 6px rgba(27,75,214,.18), 0 1px 2px rgba(27,75,214,.10);
  --shadow-btn-hover: 0 4px 12px rgba(27,75,214,.25), 0 2px 4px rgba(27,75,214,.12);

  /* Gradasi biru merek */
  --grad-brand:    linear-gradient(135deg, #3563e9 0%, #1b4bd6 100%);
  --grad-brand-hover: linear-gradient(135deg, #5c86fb 0%, #3563e9 100%);
  --grad-card:     linear-gradient(180deg, rgba(53,99,233,.03) 0%, rgba(53,99,233,.00) 100%);
  --grad-kpi:      linear-gradient(135deg, rgba(53,99,233,.05) 0%, rgba(15,163,163,.03) 50%, rgba(124,58,237,.04) 100%);

  /* --- Kerangka layout --------------------------------------------------- */
  --rail-w: 232px;
  --rail-w-collapsed: 60px;
  --topbar-h: 52px;
  --contextbar-h: 46px;
  --drawer-w: 520px;

  --speed-fast: 110ms;
  --speed: 180ms;
  --ease: cubic-bezier(.22, .61, .36, 1);

  color-scheme: light;
}

/* --- Override GELAP: OS gelap tanpa pilihan eksplisit "terang" ----------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas:        #0b1120;
    --surface:       #121b2d;
    --surface-2:     #172236;
    --surface-3:     #1d2942;
    --surface-inset: #0e1625;
    --overlay-scrim: rgba(5, 8, 18, 0.62);

    --line:        #24314c;
    --line-strong: #33425f;
    --line-faint:  #1a2640;

    --ink:    #e8edf7;
    --ink-2:  #b5c3d8;
    --ink-3:  #8a9ab5;
    --ink-4:  #6a7a96;
    --ink-on-brand: #04091a;

    --rail-bg:     #080e1b;
    --rail-fg:     #8a9ab5;
    --rail-fg-hi:  #e8edf7;
    --rail-hover:  rgba(255,255,255,.06);
    --rail-active: #3563e9;

    --accent:       #5c86fb;
    --accent-hover: #8fb0ff;
    --accent-ink:   #8fb0ff;
    --accent-soft:  #17233d;
    --accent-soft-line: #1c2a49;
    --focus-ring:   #5c86fb;

    --teal-100: #0e2f30;
    --violet-100: #241a45;

    --ok:        #4ade80;
    --ok-soft:   #0e2e1c;
    --ok-line:   #23492f;
    --warn:      #f6b95c;
    --warn-soft: #38270c;
    --warn-line: #4c3b18;
    --danger:      #ff8b8b;
    --danger-soft: #3a1518;
    --danger-line: #4f2621;
    --info:      #8fb0ff;
    --info-soft: #17233d;
    --info-line: #1c2a49;
    --neutral-soft: var(--surface-3);
    --neutral-line: var(--line-strong);

    --cat-1: #6f97ff;
    --cat-2: #f6b95c;
    --cat-3: #a98bff;
    --cat-4: #ff8b8b;
    --cat-5: #4ade80;

    --seq-1: #17233d;
    --seq-2: #1c2a49;
    --seq-3: #3563e9;
    --seq-4: #5c86fb;
    --seq-5: #8fb0ff;

    --chart-grid:      #1d2942;
    --chart-axis:      #33425f;
    --chart-reference: #6a7a96;
    --chart-surface:   var(--surface);

    --shadow-pop:    0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.55);
    --shadow-drawer: -1px 0 0 var(--line), -24px 0 48px rgba(0,0,0,.5);
    --shadow-bar:    0 1px 0 var(--line);
    --shadow-card:   0 2px 8px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    --shadow-card-hover: 0 4px 12px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.35);
    --shadow-btn:    0 2px 6px rgba(92,134,251,.2), 0 1px 2px rgba(92,134,251,.12);
    --shadow-btn-hover: 0 4px 12px rgba(92,134,251,.3), 0 2px 4px rgba(92,134,251,.14);
    --grad-brand:    linear-gradient(135deg, #5c86fb 0%, #3563e9 100%);
    --grad-brand-hover: linear-gradient(135deg, #8fb0ff 0%, #5c86fb 100%);
    --grad-card:     linear-gradient(180deg, rgba(92,134,251,.04) 0%, rgba(92,134,251,.00) 100%);
    --grad-kpi:      linear-gradient(135deg, rgba(92,134,251,.06) 0%, rgba(15,163,163,.04) 50%, rgba(169,139,255,.05) 100%);

    color-scheme: dark;
  }
}

/* ==========================================================================
   ERP Enterprise — Shell & Komponen
   Semua warna diambil dari token (tokens.css). Tidak ada literal warna tema.
   ========================================================================== */

/* --- Dasar ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  /* Wajib eksplisit: artifact dikomposit di atas ground milik host. */
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p, figure { margin: 0; }
h1, h2, h3, h4 { text-wrap: balance; line-height: var(--lh-tight); font-weight: 600; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

::selection { background: var(--accent-soft); color: var(--accent-ink); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Setiap angka, kode dokumen, SKU, dan nomor akun memakai muka mono.
   Nilai tidak boleh patah di tengah — "Rp 385 rb" harus tetap satu baris. */
.num, .code {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  white-space: nowrap;
}
.code { font-size: var(--fs-cap); letter-spacing: 0; }

.micro {
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro);
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}

.muted { color: var(--ink-3); }
.pos { color: var(--ok); }
.neg { color: var(--danger); }
.ta-r { text-align: right; }
.nowrap { white-space: nowrap; }

/* --- Kerangka aplikasi ----------------------------------------------------- */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
}
.app[data-rail="collapsed"] { grid-template-columns: var(--rail-w-collapsed) minmax(0, 1fr); }

/* --- Rail navigasi (dark navy — selaras FLMS) ------------------------------ */
.rail {
  grid-row: 1;
  display: flex;
  flex-direction: column;
  background: var(--rail-bg);
  color: var(--rail-fg);
  border-right: none;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  z-index: 30;
}

.rail-brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  height: var(--topbar-h);
  padding: 0 var(--sp-4);
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex: 0 0 auto;
}
.rail-mark {
  width: 24px; height: 24px; flex: 0 0 auto;
  border-radius: var(--r-xs);
  background: linear-gradient(135deg, #3563e9 0%, #1b4bd6 100%);
  color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 1px 4px rgba(53,99,233,.3);
}
.rail-wordmark { display: flex; flex-direction: column; min-width: 0; }
.rail-wordmark b { font-size: var(--fs-sm); font-weight: 650; letter-spacing: var(--ls-tight); color: var(--rail-fg-hi); }
.rail-wordmark span {
  font-family: var(--font-num);
  font-size: 10px; letter-spacing: var(--ls-micro);
  text-transform: uppercase; color: var(--rail-fg);
}

.rail-scroll { flex: 1 1 auto; overflow-y: auto; padding: var(--sp-3) 0 var(--sp-5); }
.rail-group + .rail-group { margin-top: var(--sp-4); }
.rail-group-label {
  padding: 0 var(--sp-4) var(--sp-2);
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro);
  text-transform: uppercase;
  color: var(--rail-fg);
}

.rail-link {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 7px var(--sp-4);
  border: 0;
  background: none;
  color: var(--rail-fg);
  font-size: var(--fs-sm);
  text-align: left;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background var(--speed-fast) var(--ease), color var(--speed-fast) var(--ease);
}
.rail-link:hover { background: var(--rail-hover); color: var(--rail-fg-hi); }
.rail-link[aria-current="page"] {
  background: rgba(53,99,233,.18);
  color: #fff;
  border-left-color: var(--rail-active);
  font-weight: 600;
}
.rail-link-icon { flex: 0 0 auto; color: currentColor; opacity: .85; }
.rail-link-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-link-count {
  font-family: var(--font-num);
  font-size: var(--fs-micro);
  color: var(--rail-fg);
  background: rgba(255,255,255,.1);
  border-radius: var(--r-pill);
  padding: 1px 6px;
}
.rail-link[aria-current="page"] .rail-link-count { background: rgba(255,255,255,.15); color: #fff; }

.rail-foot {
  flex: 0 0 auto;
  border-top: 1px solid rgba(255,255,255,.08);
  padding: var(--sp-2);
}

.app[data-rail="collapsed"] .rail-wordmark,
.app[data-rail="collapsed"] .rail-group-label,
.app[data-rail="collapsed"] .rail-link-text,
.app[data-rail="collapsed"] .rail-link-count { display: none; }
.app[data-rail="collapsed"] .rail-link { justify-content: center; padding-inline: 0; }
.app[data-rail="collapsed"] .rail-brand { justify-content: center; padding-inline: 0; }
.app[data-rail="collapsed"] .rail-group + .rail-group {
  margin-top: var(--sp-2);
  padding-top: var(--sp-2);
  border-top: 1px solid rgba(255,255,255,.06);
}

/* --- Kolom utama ------------------------------------------------------------ */
.main { display: flex; flex-direction: column; min-width: 0; }

/* --- Topbar ----------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 25;
  display: flex; align-items: center; gap: var(--sp-3);
  height: var(--topbar-h);
  padding: 0 var(--sp-4);
  background: var(--surface);
  box-shadow: 0 1px 3px rgba(16,26,46,.06);
}

.crumbs { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-size: var(--fs-sm); }
.crumbs span { color: var(--ink-4); }
.crumbs b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs-sep { color: var(--ink-4); }

.topbar-spacer { flex: 1 1 auto; }

.omni {
  display: flex; align-items: center; gap: var(--sp-2);
  width: min(320px, 34vw);
  height: 32px;
  padding: 0 var(--sp-2) 0 var(--sp-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--ink-3);
  font-size: var(--fs-sm);
  cursor: pointer;
  transition: border-color var(--speed-fast) var(--ease), background var(--speed-fast) var(--ease);
}
.omni:hover { border-color: var(--line-strong); background: var(--surface); }
.omni-text {
  flex: 1 1 auto; min-width: 0; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kbd {
  font-family: var(--font-num);
  font-size: 10px;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: var(--r-xs);
  background: var(--surface);
  color: var(--ink-3);
  white-space: nowrap;
}

.avatar {
  width: 26px; height: 26px; border-radius: var(--r-pill);
  background: var(--grad-brand); color: #FFFFFF;
  display: grid; place-items: center;
  font-size: var(--fs-micro); font-weight: 700; letter-spacing: .02em;
  flex: 0 0 auto;
  box-shadow: 0 1px 3px rgba(27,75,214,.18);
}
.avatar-lg { width: 36px; height: 36px; font-size: var(--fs-sm); }

/* --- Context bar: strip kepala dokumen ------------------------------------- */
.contextbar {
  display: flex; align-items: stretch; gap: 0;
  min-height: var(--contextbar-h);
  padding: 0 var(--sp-5);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line);
  overflow-x: auto;
}
.ctx-field {
  display: flex; flex-direction: column; justify-content: center;
  gap: 1px;
  padding: var(--sp-2) var(--sp-4) var(--sp-2) 0;
  margin-right: var(--sp-4);
  border-right: 1px solid var(--line);
  white-space: nowrap;
}
.ctx-field:last-of-type { border-right: 0; }
.ctx-field > .micro { line-height: 1.1; }
.ctx-value {
  display: flex; align-items: center; gap: var(--sp-1);
  border: 0; background: none; padding: 0;
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink);
  cursor: pointer;
}
.ctx-value:hover { color: var(--accent-ink); }
.ctx-static { font-size: var(--fs-sm); font-weight: 600; }
.contextbar-spacer { flex: 1 1 auto; }
.ctx-actions { display: flex; align-items: center; gap: var(--sp-2); }

/* --- Wilayah konten --------------------------------------------------------- */
.content {
  flex: 1 1 auto;
  padding: var(--sp-4) var(--sp-4) var(--sp-7);
  background: var(--canvas);
}
.content-inner { max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-4); }

.page-head { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; }
.page-head-text { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.page-title { font-size: var(--fs-h1); letter-spacing: var(--ls-tight); font-weight: 660; }
.page-sub { color: var(--ink-3); font-size: var(--fs-cap); max-width: 62ch; }
.page-actions { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }

/* --- Tombol (melayang & bergradasi — selaras FLMS) ------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm); font-weight: 550;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(16,26,46,.05);
  transition: background var(--speed-fast) var(--ease), border-color var(--speed-fast) var(--ease),
              color var(--speed-fast) var(--ease), box-shadow var(--speed-fast) var(--ease),
              transform var(--speed-fast) var(--ease);
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-4); box-shadow: 0 2px 6px rgba(16,26,46,.10); transform: translateY(-1px); }
.btn:active { background: var(--surface-3); transform: translateY(0); box-shadow: 0 1px 2px rgba(16,26,46,.05); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }

.btn-primary {
  background: var(--grad-brand); border-color: transparent; color: var(--ink-on-brand);
  box-shadow: var(--shadow-btn);
}
.btn-primary:hover { background: var(--grad-brand-hover); border-color: transparent; box-shadow: var(--shadow-btn-hover); transform: translateY(-1px); }
.btn-primary:active { background: var(--grad-brand); box-shadow: var(--shadow-btn); transform: translateY(0); }

.btn-danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); box-shadow: 0 2px 6px rgba(220,38,38,.12); transform: translateY(-1px); }

.btn-ghost { border-color: transparent; background: none; color: var(--ink-2); box-shadow: none; }
.btn-ghost:hover { background: var(--surface-3); border-color: transparent; color: var(--ink); box-shadow: none; }

.btn-sm { height: 24px; padding: 0 var(--sp-2); font-size: var(--fs-cap); }
.btn-icon { width: 30px; padding: 0; }
.btn-icon.btn-sm { width: 24px; }

/* --- Kartu / panel (melayang & bergradasi — selaras FLMS) ------------------- */
.card {
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column;
  min-width: 0;
  transition: box-shadow var(--speed) var(--ease), transform var(--speed) var(--ease);
}
.card:hover {
  box-shadow: var(--shadow-card-hover);
}
.card-head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--line-faint);
  min-height: 40px;
}
.card-head-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.card-title { font-size: var(--fs-sm); font-weight: 650; letter-spacing: 0; }
.card-note { font-size: var(--fs-cap); color: var(--ink-3); }
.card-tools { display: flex; align-items: center; gap: var(--sp-2); flex: 0 0 auto; }
.card-body { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.card-body-flush { padding: 0; }
.card-foot {
  padding: var(--sp-2) var(--sp-3);
  border-top: 1px solid var(--line-faint);
  display: flex; align-items: center; gap: var(--sp-3);
  font-size: var(--fs-cap); color: var(--ink-3);
}

/* --- Grid halaman ------------------------------------------------------------ */
.grid { display: grid; gap: var(--sp-4); }
.grid-kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
/* Kartu mengikuti tinggi isinya; meregangkan kartu grafik hanya menyisakan
   ruang kosong di bawah legenda. */
.grid-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.grid-1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.grid-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; }

/* --- Ubin KPI (melayang & bergradasi — selaras FLMS) ----------------------- */
.kpi {
  padding: var(--sp-3); gap: var(--sp-2);
  background: var(--grad-kpi), var(--surface);
  border-color: var(--line-faint);
}
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); }
.kpi-metric {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-metric);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.1;
  color: var(--ink);
  white-space: nowrap;
}
.kpi-metric .kpi-unit {
  font-family: var(--font-ui);
  font-size: var(--fs-cap); font-weight: 500;
  color: var(--ink-3); letter-spacing: 0;
}
.kpi-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.kpi-spark { flex: 0 0 auto; width: 72px; height: 24px; }
.kpi-delta {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-num); font-size: var(--fs-cap); font-weight: 600;
  white-space: nowrap; min-width: 0;
}
.kpi-delta .kpi-basis { font-weight: 500; color: var(--ink-3); }
.kpi-delta[data-tone="up-good"], .kpi-delta[data-tone="down-good"] { color: var(--ok); }
.kpi-delta[data-tone="up-bad"], .kpi-delta[data-tone="down-bad"] { color: var(--danger); }
.kpi-delta[data-tone="flat"] { color: var(--ink-3); }
.kpi-foot { font-size: var(--fs-cap); color: var(--ink-3); }

/* --- Pil status --------------------------------------------------------------
   Status selalu ikon + teks, tidak pernah warna saja. */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px 2px 6px;
  border-radius: var(--r-pill);
  border: 1px solid var(--neutral-line);
  background: var(--neutral-soft);
  color: var(--ink-2);
  font-size: var(--fs-cap); font-weight: 600; line-height: 1.5;
  white-space: nowrap;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.pill[data-tone="ok"]      { color: var(--ok);     background: var(--ok-soft);     border-color: var(--ok-line); }
.pill[data-tone="warn"]    { color: var(--warn);   background: var(--warn-soft);   border-color: var(--warn-line); }
.pill[data-tone="danger"]  { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
.pill[data-tone="info"]    { color: var(--info);   background: var(--info-soft);   border-color: var(--info-line); }
.pill[data-tone="accent"]  { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-soft-line); }

/* --- Kolom kendali ------------------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: var(--fs-cap); font-weight: 600; color: var(--ink-2); }
.field-hint { font-size: var(--fs-cap); color: var(--ink-3); }

.input, .select, .textarea {
  height: 30px;
  padding: 0 var(--sp-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  width: 100%;
  transition: border-color var(--speed-fast) var(--ease), box-shadow var(--speed-fast) var(--ease);
}
.textarea { height: auto; padding: var(--sp-2) var(--sp-3); resize: vertical; line-height: var(--lh-snug); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-4); }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }
.input-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }

.select {
  appearance: none;
  padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.search-wrap { position: relative; display: flex; align-items: center; min-width: 0; }
.search-wrap > svg { position: absolute; left: 9px; color: var(--ink-4); pointer-events: none; }
.search-wrap > .input { padding-left: 30px; }

.check { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }

.switch {
  position: relative; display: inline-flex; align-items: center;
  width: 34px; height: 19px; flex: 0 0 auto; cursor: pointer;
}
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-track {
  width: 100%; height: 100%; border-radius: var(--r-pill);
  background: var(--line-strong);
  transition: background var(--speed) var(--ease);
}
.switch-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--surface);
  transition: transform var(--speed) var(--ease);
  pointer-events: none;
}
.switch input:checked ~ .switch-track { background: var(--accent); }
.switch input:checked ~ .switch-thumb { transform: translateX(15px); }
.switch input:focus-visible ~ .switch-track { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

.segmented {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--surface-3);
  border-radius: var(--r-sm);
}
.segmented button {
  border: 0; background: none; cursor: pointer;
  padding: 3px 10px; border-radius: var(--r-xs);
  font-size: var(--fs-cap); font-weight: 600; color: var(--ink-3);
  transition: background var(--speed-fast) var(--ease), color var(--speed-fast) var(--ease);
}
.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* --- Bilah alat daftar --------------------------------------------------------- */
.toolbar {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.toolbar-search { flex: 0 1 260px; min-width: 160px; }
.toolbar-spacer { flex: 1 1 auto; }

.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--surface);
  font-size: var(--fs-cap); font-weight: 600; color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(16,26,46,.04);
  transition: background var(--speed-fast) var(--ease), border-color var(--speed-fast) var(--ease),
              color var(--speed-fast) var(--ease), box-shadow var(--speed-fast) var(--ease);
}
.chip:hover { border-color: var(--ink-4); color: var(--ink); box-shadow: 0 2px 4px rgba(16,26,46,.08); }
.chip[aria-pressed="true"] {
  background: var(--accent-soft); border-color: var(--accent-soft-line); color: var(--accent-ink);
}
.chip-count { font-family: var(--font-num); font-size: 10px; color: var(--ink-4); }
.chip[aria-pressed="true"] .chip-count { color: var(--accent-ink); }

/* --- Tabel padat ---------------------------------------------------------------- */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-sm);
}
.table th, .table td {
  padding: 9px var(--sp-3);
  text-align: left;
  border-bottom: 1px solid var(--line-faint);
  vertical-align: middle;
}
.table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-micro);
  font-family: var(--font-num);
  letter-spacing: var(--ls-micro);
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-3);
  white-space: nowrap;
}
.table th.ta-r, .table td.ta-r { text-align: right; }
.table tbody tr { cursor: pointer; transition: background var(--speed-fast) var(--ease); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr[aria-selected="true"] { background: var(--accent-soft); }
.table tbody tr:last-child td { border-bottom: 0; }
.table td.num, .table td .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.cell-strong { font-weight: 600; color: var(--ink); }
.cell-sub { display: block; font-size: var(--fs-cap); color: var(--ink-3); }
.col-check { width: 34px; }
.col-check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; display: block; }

.th-sort {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.th-sort:hover { color: var(--ink); }
.th-sort[data-active="true"] { color: var(--accent-ink); }
.sort-caret { opacity: 0; transition: opacity var(--speed-fast) var(--ease); }
.th-sort:hover .sort-caret, .th-sort[data-active="true"] .sort-caret { opacity: 1; }

/* Meteran stok inline.
   `display:block` wajib: elemen span sebaris mengabaikan width/height, sehingga
   isian meteran tidak akan tampak sama sekali tanpa ini. */
.meter { display: flex; align-items: center; gap: var(--sp-2); min-width: 120px; }
.meter-track {
  display: block;
  flex: 1 1 auto; height: 5px; min-width: 48px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}
.meter-fill {
  display: block;
  height: 100%; border-radius: var(--r-pill);
  background: var(--accent);
}
.meter-fill[data-tone="warn"] { background: var(--warn); }
.meter-fill[data-tone="danger"] { background: var(--danger); }
.meter-val { font-family: var(--font-num); font-size: var(--fs-cap); color: var(--ink-3); min-width: 34px; text-align: right; }

/* Bilah aksi massal */
.bulkbar {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  background: var(--accent-soft);
  border-bottom: 1px solid var(--accent-soft-line);
  font-size: var(--fs-sm);
}
.bulkbar b { font-family: var(--font-num); }

/* Paginasi */
.pager { display: flex; align-items: center; gap: var(--sp-2); }
.pager-info { font-family: var(--font-num); font-size: var(--fs-cap); color: var(--ink-3); }

/* --- Keadaan kosong ------------------------------------------------------------- */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  padding: var(--sp-8) var(--sp-5);
  text-align: center;
  color: var(--ink-3);
  background-image: repeating-linear-gradient(
    135deg, transparent 0 7px, var(--line-faint) 7px 8px
  );
  background-clip: padding-box;
}
.empty-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--sp-5) var(--sp-6);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
}
.empty-title { font-size: var(--fs-sm); font-weight: 650; color: var(--ink); }
.empty-note { font-size: var(--fs-cap); max-width: 42ch; }

/* --- Daftar kerja (antrean persetujuan, peringatan) ------------------------------ */
.worklist { display: flex; flex-direction: column; }
.worklist-item {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line-faint);
  cursor: pointer; text-align: left; width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  background: none;
  transition: background var(--speed-fast) var(--ease);
}
.worklist-item:hover { background: var(--surface-2); }
.worklist-item:last-child { border-bottom: 0; }
.worklist-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.worklist-title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
.worklist-meta { font-size: var(--fs-cap); color: var(--ink-3); display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.worklist-side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

.wl-icon {
  width: 24px; height: 24px; flex: 0 0 auto;
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--ink-3);
}
.wl-icon[data-tone="warn"]   { background: var(--warn-soft);   color: var(--warn); }
.wl-icon[data-tone="danger"] { background: var(--danger-soft); color: var(--danger); }
.wl-icon[data-tone="ok"]     { background: var(--ok-soft);     color: var(--ok); }
.wl-icon[data-tone="info"]   { background: var(--info-soft);   color: var(--info); }
.wl-icon[data-tone="accent"] { background: var(--accent-soft); color: var(--accent-ink); }

/* --- Grafik --------------------------------------------------------------------- */
.chart { position: relative; width: 100%; }
.chart-svg { width: 100%; display: block; overflow: visible; }
.chart-legend {
  display: flex; align-items: center; gap: var(--sp-4);
  flex-wrap: wrap;
  font-size: var(--fs-cap);
  color: var(--ink-2);
}
.chart-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.chart-swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
.chart-swatch-line { width: 14px; height: 0; border-top: 2px dashed var(--chart-reference); border-radius: 0; }

.chart-tip {
  position: absolute; z-index: 12;
  min-width: 140px;
  padding: var(--sp-2) var(--sp-3);
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
  font-size: var(--fs-cap);
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%);
  transition: opacity var(--speed-fast) var(--ease);
}
.chart-tip[data-show="true"] { opacity: 1; }
.chart-tip-head {
  font-family: var(--font-num); font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro); text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 4px;
}
.chart-tip-row { display: flex; align-items: center; gap: var(--sp-2); padding: 2px 0; }
.chart-tip-row span { flex: 1 1 auto; color: var(--ink-2); }
.chart-tip-row b { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }

/* Bilah komposisi bertumpuk */
.stackbar { display: flex; width: 100%; height: 34px; gap: 2px; }
.stackbar-seg { border-radius: 2px; min-width: 3px; transition: opacity var(--speed-fast) var(--ease); cursor: default; }
.stackbar-seg:hover { opacity: .82; }
.stack-legend { display: flex; flex-direction: column; gap: 0; }
.stack-legend-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 6px 0;
  border-bottom: 1px solid var(--line-faint);
  font-size: var(--fs-cap);
}
.stack-legend-row:last-child { border-bottom: 0; }
.stack-legend-row .stack-name { flex: 1 1 auto; color: var(--ink-2); }
.stack-legend-row .num { color: var(--ink); font-weight: 600; }
.stack-legend-row .stack-share { color: var(--ink-3); min-width: 44px; text-align: right; }

/* --- Papan (Kanban) — melayang --------------------------------------------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: var(--sp-3); align-items: start; }
.board-col { background: var(--surface-2); border: 1px solid var(--line-faint); border-radius: var(--r-lg); display: flex; flex-direction: column; box-shadow: var(--shadow-card); }
.board-col-head {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--line-faint);
}
.board-col-head .card-title { flex: 1 1 auto; }
.board-col-body { padding: var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-2); min-height: 60px; }
.board-card {
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: var(--sp-2) var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
  text-align: left; width: 100%; cursor: pointer;
  box-shadow: 0 1px 3px rgba(16,26,46,.05);
  transition: border-color var(--speed-fast) var(--ease), box-shadow var(--speed-fast) var(--ease), transform var(--speed-fast) var(--ease);
}
.board-card:hover { border-color: var(--ink-4); box-shadow: 0 3px 10px rgba(16,26,46,.10); transform: translateY(-1px); }
.board-card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.board-card-title { font-size: var(--fs-sm); font-weight: 600; }
.board-card-meta { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-cap); color: var(--ink-3); }

/* --- Matriks izin ------------------------------------------------------------------ */
.matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-sm); }
.matrix th, .matrix td { padding: 8px var(--sp-3); border-bottom: 1px solid var(--line-faint); }
.matrix thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-family: var(--font-num); font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro); text-transform: uppercase;
  color: var(--ink-3); font-weight: 600; text-align: center;
}
.matrix thead th:first-child { text-align: left; }
.matrix tbody th {
  text-align: left; font-weight: 600; font-size: var(--fs-sm);
  color: var(--ink); white-space: nowrap;
}
.matrix td { text-align: center; }
.matrix-row-group td, .matrix-row-group th {
  background: var(--surface-inset);
  font-family: var(--font-num); font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro); text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.perm {
  width: 22px; height: 22px; margin: 0 auto;
  border-radius: var(--r-xs);
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid; place-items: center;
  color: var(--ink-4);
  cursor: pointer; padding: 0;
}
.perm:hover { border-color: var(--ink-4); }
.perm[data-level="full"]  { background: var(--accent-soft); border-color: var(--accent-soft-line); color: var(--accent-ink); }
.perm[data-level="read"]  { background: var(--info-soft);   border-color: var(--info-line);        color: var(--info); }
.perm[data-level="none"]  { background: var(--surface-2);   border-color: var(--line);             color: var(--ink-4); }

/* --- Laci rekaman -------------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: var(--overlay-scrim);
  opacity: 0;
  animation: fade-in var(--speed) var(--ease) forwards;
}
@keyframes fade-in { to { opacity: 1; } }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 61;
  width: min(var(--drawer-w), 100vw);
  background: var(--grad-card), var(--surface);
  box-shadow: -4px 0 24px rgba(16,26,46,.10), -1px 0 0 var(--line-faint);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  animation: slide-in var(--speed) var(--ease) forwards;
}
@keyframes slide-in { to { transform: translateX(0); } }

.drawer-head {
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: var(--sp-3);
  flex: 0 0 auto;
}
.drawer-head-top { display: flex; align-items: flex-start; gap: var(--sp-3); }
.drawer-eyebrow { display: flex; align-items: center; gap: var(--sp-2); }
.drawer-title { font-size: var(--fs-h3); letter-spacing: var(--ls-tight); }
.drawer-body { flex: 1 1 auto; overflow-y: auto; }
.drawer-foot {
  flex: 0 0 auto;
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2);
}

.tabs { display: flex; gap: var(--sp-4); border-bottom: 1px solid var(--line); padding: 0 var(--sp-4); }
.tab {
  border: 0; background: none; cursor: pointer;
  padding: var(--sp-2) 0;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-3);
  transition: color var(--speed-fast) var(--ease), border-color var(--speed-fast) var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }

.section { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.section + .section { border-top: 1px solid var(--line-faint); }
.section-title {
  font-family: var(--font-num); font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro); text-transform: uppercase; color: var(--ink-3);
  font-weight: 600;
}

.deflist { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 7px var(--sp-3); font-size: var(--fs-sm); }
.deflist dt { color: var(--ink-3); }
.deflist dd { margin: 0; color: var(--ink); font-weight: 550; }

.totals { display: flex; flex-direction: column; gap: 0; }
.totals-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: 6px 0;
  font-size: var(--fs-sm);
  border-bottom: 1px solid var(--line-faint);
}
.totals-row:last-child { border-bottom: 0; }
.totals-row span { color: var(--ink-3); }
.totals-row b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.totals-grand { padding-top: var(--sp-2); border-top: 1px solid var(--line-strong); }
.totals-grand span { color: var(--ink); font-weight: 600; }
.totals-grand b { font-size: var(--fs-lead); }

/* Linimasa aktivitas & persetujuan */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: var(--sp-3); position: relative; padding-bottom: var(--sp-4); }
.tl-item:last-child { padding-bottom: 0; }
.tl-rail { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; width: 20px; }
.tl-node {
  width: 9px; height: 9px; margin-top: 5px;
  border-radius: 50%;
  background: var(--surface); border: 2px solid var(--line-strong);
  flex: 0 0 auto;
}
.tl-node[data-tone="ok"]     { border-color: var(--ok); background: var(--ok); }
.tl-node[data-tone="accent"] { border-color: var(--accent); background: var(--accent); }
.tl-node[data-tone="warn"]   { border-color: var(--warn); background: var(--warn); }
.tl-line { flex: 1 1 auto; width: 1px; background: var(--line); margin-top: 3px; }
.tl-item:last-child .tl-line { display: none; }
.tl-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; }
.tl-title { font-size: var(--fs-sm); }
.tl-title b { font-weight: 650; }
.tl-meta { font-size: var(--fs-cap); color: var(--ink-3); font-family: var(--font-num); }

/* --- Modal -------------------------------------------------------------------------- */
.modal {
  position: fixed; z-index: 61;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(680px, calc(100vw - 32px));
  max-height: calc(100vh - 64px);
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 32px rgba(16,26,46,.16), 0 2px 8px rgba(16,26,46,.08);
  display: flex; flex-direction: column;
  animation: pop-in var(--speed) var(--ease);
}
@keyframes pop-in {
  from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}
.modal-head {
  padding: var(--sp-4);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: flex-start; gap: var(--sp-3);
}
.modal-title { font-size: var(--fs-h3); letter-spacing: var(--ls-tight); }
.modal-body { padding: var(--sp-4); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.modal-foot {
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.form-grid-full { grid-column: 1 / -1; }

.lines { border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.lines .table th { background: var(--surface-2); position: static; }
.lines .table tbody tr { cursor: default; }
.lines .table tbody tr:hover { background: none; }

/* --- Palet perintah ------------------------------------------------------------------- */
.palette {
  position: fixed; z-index: 61;
  top: 12vh; left: 50%; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px));
  max-height: 68vh;
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 32px rgba(16,26,46,.16), 0 2px 8px rgba(16,26,46,.08);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: pop-down var(--speed) var(--ease);
}
@keyframes pop-down {
  from { opacity: 0; transform: translate(-50%, -8px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
.palette-input-wrap { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
.palette-input {
  flex: 1 1 auto; border: 0; background: none; outline: none;
  font-size: var(--fs-lead); color: var(--ink);
}
.palette-input::placeholder { color: var(--ink-4); }
.palette-results { overflow-y: auto; padding: var(--sp-2) 0; }
.palette-group-label {
  padding: var(--sp-2) var(--sp-4) 4px;
  font-family: var(--font-num); font-size: var(--fs-micro);
  letter-spacing: var(--ls-micro); text-transform: uppercase; color: var(--ink-4);
}
.palette-item {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: 7px var(--sp-4);
  border: 0; background: none; cursor: pointer; text-align: left;
  font-size: var(--fs-sm); color: var(--ink-2);
}
.palette-item[data-active="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.palette-item-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item-hint { font-family: var(--font-num); font-size: var(--fs-micro); color: var(--ink-4); }
.palette-foot {
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  display: flex; gap: var(--sp-4);
  font-size: var(--fs-micro); color: var(--ink-4);
}

/* --- Popover -------------------------------------------------------------------------- */
.popover {
  position: fixed; z-index: 61;
  width: min(340px, calc(100vw - 24px));
  max-height: 70vh; overflow-y: auto;
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card-hover);
  animation: pop-down var(--speed-fast) var(--ease);
}
.popover-head {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--sp-2);
}
.popover-head .card-title { flex: 1 1 auto; }
.menu { padding: var(--sp-1) 0; }
.menu-item {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: 7px var(--sp-4);
  border: 0; background: none; cursor: pointer; text-align: left;
  font-size: var(--fs-sm); color: var(--ink-2);
}
.menu-item:hover { background: var(--surface-2); color: var(--ink); }
.menu-item[aria-checked="true"] { color: var(--accent-ink); font-weight: 600; }
.menu-sep { height: 1px; background: var(--line); margin: var(--sp-1) 0; }

.dot-badge {
  position: absolute; top: 3px; right: 3px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger);
  border: 1.5px solid var(--surface);
}
.has-badge { position: relative; }

/* --- Toast ------------------------------------------------------------------------------ */
.toasts {
  position: fixed; z-index: 80;
  right: var(--sp-5); bottom: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-2);
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  width: min(360px, calc(100vw - 32px));
  padding: var(--sp-2) var(--sp-3);
  background: var(--grad-card), var(--surface);
  border: 1px solid var(--line-faint);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
  pointer-events: auto;
  animation: toast-in var(--speed) var(--ease);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast[data-tone="ok"]     { border-left-color: var(--ok); }
.toast[data-tone="warn"]   { border-left-color: var(--warn); }
.toast[data-tone="danger"] { border-left-color: var(--danger); }
.toast-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.toast-title { font-size: var(--fs-sm); font-weight: 650; }
.toast-note { font-size: var(--fs-cap); color: var(--ink-3); }

/* --- Halaman pengaturan ------------------------------------------------------------------- */
.setting-row {
  display: flex; align-items: flex-start; gap: var(--sp-4);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line-faint);
}
.setting-row:last-child { border-bottom: 0; }
.setting-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.setting-name { font-size: var(--fs-sm); font-weight: 600; }
.setting-note { font-size: var(--fs-cap); color: var(--ink-3); max-width: 58ch; }
.setting-control { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2); }

/* Petak token untuk halaman sistem desain */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--sp-3); }
.swatch { display: flex; flex-direction: column; gap: 5px; }
.swatch-chip { height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); }
.swatch-name { font-size: var(--fs-cap); font-weight: 600; }

/* --- Responsif ------------------------------------------------------------------------------ */
@media (max-width: 1360px) {
  .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1180px) {
  .app { grid-template-columns: var(--rail-w-collapsed) minmax(0, 1fr); }
  .app .rail-wordmark,
  .app .rail-group-label,
  .app .rail-link-text,
  .app .rail-link-count { display: none; }
  .app .rail-link { justify-content: center; padding-inline: 0; }
  .app .rail-brand { justify-content: center; padding-inline: 0; }
  .grid-2-1, .grid-1-1, .grid-1-2 { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
}
@media (max-width: 820px) {
  .content { padding: var(--sp-4) var(--sp-3) var(--sp-7); }
  .topbar { padding: 0 var(--sp-3); }
  .contextbar { padding: 0 var(--sp-3); }
  .grid-kpi { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: minmax(0, 1fr); }
  .omni { width: 40px; padding: 0; justify-content: center; }
  .omni-text, .omni .kbd { display: none; }
  .crumbs .crumbs-trail { display: none; }
  .page-title { font-size: var(--fs-h2); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .deflist { grid-template-columns: minmax(0, 1fr); gap: 2px var(--sp-3); }
  .deflist dd { margin-bottom: 6px; }
  .toasts { right: var(--sp-3); left: var(--sp-3); bottom: var(--sp-3); }
  .toast { width: auto; }
}
@media (max-width: 720px) {
  .drawer { width: 100vw; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
}

/* ====================================================================== */
/* CRM pipeline                                                            */
/* ====================================================================== */
.crm-card { cursor: pointer; }
.crm-card-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-2); margin-top: var(--sp-2);
}
.icon-inline { display: inline-block; vertical-align: -2px; width: 14px; height: 14px; }

/* ====================================================================== */
/* Project timeline / Gantt                                                */
/* ====================================================================== */
.project-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--sp-4); padding: var(--sp-4) var(--sp-5) 0;
}
.gantt { display: flex; flex-direction: column; gap: 6px; padding: 0 var(--sp-5) var(--sp-4); }
.gantt-row { display: flex; align-items: center; gap: var(--sp-3); }
.gantt-label {
  flex: 0 0 160px; font-size: var(--fs-cap); color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gantt-track {
  flex: 1; height: 10px; background: var(--line-faint); border-radius: 5px;
  position: relative; overflow: hidden;
}
.gantt-bar {
  position: absolute; top: 0; height: 100%; border-radius: 5px;
  background: var(--line); overflow: hidden;
}
.gantt-fill {
  display: block; height: 100%; border-radius: 5px;
  background: var(--accent);
}
.gantt-fill[data-tone="ok"] { background: var(--ok); }
.gantt-fill[data-tone="accent"] { background: var(--accent); }
@media (max-width: 960px) { .gantt-label { flex: 0 0 100px; } }
@media (max-width: 640px) { .gantt-label { flex: 0 0 70px; font-size: 11px; } }

/* ====================================================================== */
/* Budget variance bars                                                    */
/* ====================================================================== */
.budget-bar { display: flex; align-items: center; gap: var(--sp-2); min-width: 120px; }
.budget-bar-track {
  flex: 1; height: 10px; background: var(--line-faint); border-radius: 5px;
  position: relative; overflow: hidden;
}
.budget-bar-actual {
  position: absolute; top: 0; left: 0; height: 100%; border-radius: 5px 0 0 5px;
  background: var(--accent);
}
.budget-bar-actual[data-tone="warn"] { background: var(--warn); }
.budget-bar-actual[data-tone="danger"] { background: var(--danger); }
.budget-bar-commit {
  position: absolute; top: 0; height: 100%;
  background: var(--accent); opacity: .35;
}

/* ====================================================================== */
/* POS table compact helper                                                */
/* ====================================================================== */
.tbl-sm th, .tbl-sm td { padding: var(--sp-1) var(--sp-2); font-size: var(--fs-cap); }

/* ====================================================================== */
/* AI Copilot floating panel                                               */
/* ====================================================================== */
.ai-fab {
  position: fixed; bottom: var(--sp-5); right: var(--sp-5); z-index: 900;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--grad-brand); color: var(--ink-on-brand); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-btn), 0 4px 16px rgba(27,75,214,.25);
  transition: transform .15s ease, box-shadow .15s ease;
}
.ai-fab:hover { transform: scale(1.08) translateY(-2px); box-shadow: var(--shadow-btn-hover), 0 8px 24px rgba(27,75,214,.3); }
.ai-fab svg { stroke: currentColor; width: 20px; height: 20px; }

.ai-panel {
  position: fixed; bottom: 66px; right: var(--sp-5); z-index: 901;
  width: 360px; max-height: 480px; display: flex; flex-direction: column;
  background: var(--grad-card), var(--surface); border: 1px solid var(--line-faint);
  border-radius: var(--r-lg); box-shadow: var(--shadow-card-hover);
  overflow: hidden;
}
.ai-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.ai-panel-title {
  font-weight: 600; font-size: var(--fs-sm);
  display: flex; align-items: center; gap: var(--sp-2);
}
.ai-panel-body {
  flex: 1; overflow-y: auto; padding: var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.ai-msg { display: flex; }
.ai-msg-user { justify-content: flex-end; }
.ai-msg-bubble {
  max-width: 88%; padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md); font-size: var(--fs-sm); line-height: 1.5;
}
.ai-msg-assistant .ai-msg-bubble {
  background: var(--surface-3); color: var(--ink);
}
.ai-msg-user .ai-msg-bubble {

/* ==========================================================================
   ERP Enterprise — Pemformat angka & mesin grafik SVG
   --------------------------------------------------------------------------
   Tanpa pustaka eksternal. Warna selalu dibaca dari token CSS saat menggambar,
   sehingga pergantian tema langsung menghasilkan palet mode yang benar
   (dipilih ulang, bukan dibalik otomatis).

   Aturan yang dipatuhi:
   - satu sumbu nilai per grafik; tidak pernah dua skala y;
   - kategorikal dipakai untuk identitas, ramp sekuensial untuk ember ordinal,
     satu rona untuk peringkat satu ukuran;
   - marka tipis, ujung data membulat 4px menempel garis dasar, celah 2px
     antar isian, penanda >= 8px, cincin permukaan 2px pada marka bertumpuk;
   - label langsung selektif, bukan angka di setiap titik;
   - lapisan hover (crosshair + tooltip) ada secara bawaan.
   ========================================================================== */

/* --- Pemformat (id-ID) ---------------------------------------------------- */
const FMT = (() => {
  const nf = (min, max) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: min, maximumFractionDigits: max });
  const n0 = nf(0, 0), n1 = nf(1, 1), n2 = nf(2, 2);
  const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  const int = (v) => n0.format(v);
  const dec = (v, d = 1) => (d === 2 ? n2 : n1).format(v);

  /** "Rp 4.823.400.000" */
  const rp = (v) => 'Rp ' + n0.format(Math.round(v));

  /** "Rp 4,82 M" — rb / jt / M / T */
  const rpCompact = (v) => {
    const s = v < 0 ? '-' : '';
    const a = Math.abs(v);
    if (a >= 1e12) return `${s}Rp ${n2.format(a / 1e12)} T`;
    if (a >= 1e9) return `${s}Rp ${n2.format(a / 1e9)} M`;
    if (a >= 1e6) return `${s}Rp ${n1.format(a / 1e6)} jt`;
    if (a >= 1e3) return `${s}Rp ${n0.format(a / 1e3)} rb`;
    return `${s}Rp ${n0.format(a)}`;
  };

  /** Ringkas tanpa awalan mata uang, untuk label sumbu. */
  const compact = (v) => {
    const a = Math.abs(v);
    if (a >= 1e12) return n1.format(v / 1e12) + ' T';
    if (a >= 1e9) return n1.format(v / 1e9) + ' M';
    if (a >= 1e6) return n1.format(v / 1e6) + ' jt';
    if (a >= 1e3) return n0.format(v / 1e3) + ' rb';
    return n0.format(v);
  };

  const pct = (v, d = 1) => dec(v, d) + '%';
  const signedPct = (v, d = 1) => (v > 0 ? '+' : '') + dec(v, d) + '%';

  /** "2026-08-14" -> "14 Agu 2026" */
  const date = (iso) => {
    const [y, m, d] = String(iso).split('-').map(Number);
    if (!y || !m || !d) return iso;
    return `${d} ${BULAN[m - 1]} ${y}`;
  };

  const value = (v, format) => {
    switch (format) {
      case 'rp': return rp(v);
      case 'rp-compact': return rpCompact(v);
      case 'int': return int(v);
      case 'pct': return pct(v);
      case 'miliar': return 'Rp ' + n2.format(v) + ' M';
      default: return int(v);
    }
  };

  return { int, dec, rp, rpCompact, compact, pct, signedPct, date, value };
})();

/* --- Mesin grafik ---------------------------------------------------------- */
const Charts = (() => {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const registry = new Set();

  const cssVar = (name) =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  const theme = () => ({
    grid: cssVar('--chart-grid'),
    axis: cssVar('--chart-axis'),
    reference: cssVar('--chart-reference'),
    surface: cssVar('--chart-surface'),
    ink3: cssVar('--ink-3'),
    ink4: cssVar('--ink-4'),
    cat: [cssVar('--cat-1'), cssVar('--cat-2'), cssVar('--cat-3'), cssVar('--cat-4'), cssVar('--cat-5')],
    seq: [cssVar('--seq-1'), cssVar('--seq-2'), cssVar('--seq-3'), cssVar('--seq-4'), cssVar('--seq-5')],
  });

  const el = (tag, attrs = {}) => {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    return node;
  };

  /** Batas atas "rapi" dan langkah tik untuk sumbu nilai.
      Kandidat langkah dibuat rapat agar marka mengisi tinggi plot; tangga
      1/2/5 saja membuat puncak data kerap berhenti di separuh grafik. */
  const STEPS = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  function niceScale(max, ticks = 4) {
    if (!(max > 0)) return { max: 1, step: 0.25 };
    const raw = max / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (STEPS.find((s) => norm <= s) ?? 10) * mag;
    return { max: step * ticks, step };
  }

  /** Persegi dengan dua sudut atas membulat, menempel garis dasar. */
  function topRoundedPath(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, h, w / 2));
    if (h <= 0) return `M${x},${y} L${x + w},${y}`;
    return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y} ` +
           `L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
  }

  function ensureTip(container) {
    let tip = container.querySelector('.chart-tip');
    if (!tip) {
      tip = document.createElement('div');
      tip.className = 'chart-tip';
      tip.setAttribute('role', 'status');
      container.appendChild(tip);
    }
    return tip;
  }

  function placeTip(container, tip, x, y) {
    const w = container.clientWidth;
    const half = tip.offsetWidth / 2;
    const left = Math.max(half + 4, Math.min(w - half - 4, x));
    tip.style.left = `${left}px`;
    tip.style.top = `${Math.max(tip.offsetHeight + 6, y - 10)}px`;
  }

  /* --- Grafik garis: aktual (area + garis) vs acuan (garis putus) --------- */
  function lineChart(container, opts) {
    const draw = () => {
      const t = theme();
      const W = container.clientWidth || 600;
      const H = opts.height || 236;
      const pad = { t: 16, r: 16, b: 26, l: 58 };
      const iw = Math.max(40, W - pad.l - pad.r);
      const ih = Math.max(40, H - pad.t - pad.b);
      const { labels, actual, target } = opts;
      const n = labels.length;

      const peak = Math.max(...actual, ...target);
      const { max, step } = niceScale(peak, 4);
      const x = (i) => pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      const y = (v) => pad.t + ih - (v / max) * ih;

      const svg = el('svg', {
        class: 'chart-svg', viewBox: `0 0 ${W} ${H}`, width: W, height: H,
        role: 'img',
        'aria-label': `${opts.title}. ${labels[0]} ${FMT.value(actual[0], opts.format)} hingga ${labels[n - 1]} ${FMT.value(actual[n - 1], opts.format)}.`,
      });

      const defs = el('defs');
      const gid = `fill-${Math.random().toString(36).slice(2, 8)}`;
      const grad = el('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
      grad.appendChild(el('stop', { offset: '0%', 'stop-color': t.cat[0], 'stop-opacity': 0.22 }));
      grad.appendChild(el('stop', { offset: '100%', 'stop-color': t.cat[0], 'stop-opacity': 0.02 }));
      defs.appendChild(grad);
      svg.appendChild(defs);

      /* Kisi & label sumbu nilai — resesif. */
      for (let v = 0; v <= max + 1e-9; v += step) {
        const yy = y(v);
        svg.appendChild(el('line', {
          x1: pad.l, y1: yy, x2: pad.l + iw, y2: yy,
          stroke: v === 0 ? t.axis : t.grid, 'stroke-width': 1,
        }));
        const label = el('text', {
          x: pad.l - 10, y: yy + 4, 'text-anchor': 'end',
          fill: t.ink4, 'font-size': 11, 'font-family': 'var(--font-num)',
        });
        label.textContent = FMT.compact(v * (opts.scale || 1));
        svg.appendChild(label);
      }

      /* Label sumbu kategori — dijarangkan bila sempit. */
      const every = iw / n < 40 ? 2 : 1;
      labels.forEach((lab, i) => {
        if (i % every !== 0 && i !== n - 1) return;
        const label = el('text', {
          x: x(i), y: pad.t + ih + 17, 'text-anchor': 'middle',
          fill: t.ink4, 'font-size': 11, 'font-family': 'var(--font-num)',
        });
        label.textContent = lab;
        svg.appendChild(label);
      });

      const line = (vals) => vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');

      svg.appendChild(el('path', {
        d: `${line(actual)} L${x(n - 1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`,
        fill: `url(#${gid})`, stroke: 'none',
      }));

      /* Acuan target: garis putus netral, bukan rona kategorikal kedua. */
      svg.appendChild(el('path', {
        d: line(target), fill: 'none', stroke: t.reference,
        'stroke-width': 2, 'stroke-dasharray': '5 4', 'stroke-linecap': 'round',
      }));

      svg.appendChild(el('path', {
        d: line(actual), fill: 'none', stroke: t.cat[0],
        'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));

      /* Titik akhir ditekankan, dengan cincin permukaan 2px. */
      svg.appendChild(el('circle', {
        cx: x(n - 1), cy: y(actual[n - 1]), r: 4.5,
        fill: t.cat[0], stroke: t.surface, 'stroke-width': 2,
      }));

      /* Lapisan hover */
      const hoverLine = el('line', {
        y1: pad.t, y2: pad.t + ih, stroke: t.axis, 'stroke-width': 1,
        'stroke-dasharray': '3 3', opacity: 0,
      });
      const dotA = el('circle', { r: 4.5, fill: t.cat[0], stroke: t.surface, 'stroke-width': 2, opacity: 0 });
      const dotT = el('circle', { r: 4, fill: t.reference, stroke: t.surface, 'stroke-width': 2, opacity: 0 });
      svg.appendChild(hoverLine); svg.appendChild(dotA); svg.appendChild(dotT);

      const hit = el('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' });
      svg.appendChild(hit);

      container.textContent = '';
      container.appendChild(svg);
      const tip = ensureTip(container);

      const show = (i) => {
        hoverLine.setAttribute('x1', x(i)); hoverLine.setAttribute('x2', x(i));
        hoverLine.setAttribute('opacity', 1);
        dotA.setAttribute('cx', x(i)); dotA.setAttribute('cy', y(actual[i])); dotA.setAttribute('opacity', 1);
        dotT.setAttribute('cx', x(i)); dotT.setAttribute('cy', y(target[i])); dotT.setAttribute('opacity', 1);
        tip.innerHTML =
          `<div class="chart-tip-head">${labels[i]} 2026</div>` +
          `<div class="chart-tip-row"><i class="chart-swatch" style="background:${t.cat[0]}"></i><span>Pendapatan</span><b>${FMT.value(actual[i] * (opts.scale || 1), opts.format)}</b></div>` +
          `<div class="chart-tip-row"><i class="chart-swatch chart-swatch-line"></i><span>Target</span><b>${FMT.value(target[i] * (opts.scale || 1), opts.format)}</b></div>`;
        tip.dataset.show = 'true';
        placeTip(container, tip, x(i), y(Math.max(actual[i], target[i])));
      };
      const hide = () => {
        hoverLine.setAttribute('opacity', 0);
        dotA.setAttribute('opacity', 0); dotT.setAttribute('opacity', 0);
        tip.dataset.show = 'false';
      };

      const onMove = (ev) => {
        const rect = svg.getBoundingClientRect();
        const px = ((ev.clientX - rect.left) / rect.width) * W;
        const i = Math.max(0, Math.min(n - 1, Math.round(((px - pad.l) / iw) * (n - 1))));
        show(i);
      };
      hit.addEventListener('pointermove', onMove);
      hit.addEventListener('pointerdown', onMove);
      hit.addEventListener('pointerleave', hide);
    };

    return register(container, draw);
  }

  /* --- Kolom dengan ramp sekuensial (ember ordinal, mis. umur piutang) ---- */
  function columnChart(container, opts) {
    const draw = () => {
      const t = theme();
      const W = container.clientWidth || 480;
      const H = opts.height || 210;
      const pad = { t: 26, r: 8, b: 40, l: 8 };
      const iw = Math.max(40, W - pad.l - pad.r);
      const ih = Math.max(40, H - pad.t - pad.b);
      const items = opts.items;
      const n = items.length;
      const { max } = niceScale(Math.max(...items.map((d) => d.value)), 4);

      const band = iw / n;
      const barW = Math.min(band - 12, 62);
      const cx = (i) => pad.l + band * i + band / 2;
      const y = (v) => pad.t + ih - (v / max) * ih;

      const svg = el('svg', {
        class: 'chart-svg', viewBox: `0 0 ${W} ${H}`, width: W, height: H,
        role: 'img', 'aria-label': opts.ariaLabel || opts.title,
      });

      svg.appendChild(el('line', {
        x1: pad.l, y1: pad.t + ih, x2: pad.l + iw, y2: pad.t + ih,
        stroke: t.axis, 'stroke-width': 1,
      }));

      const tip = ensureTip(container);

      items.forEach((d, i) => {
        const h = Math.max(2, (d.value / max) * ih);
        const bx = cx(i) - barW / 2;
        const by = pad.t + ih - h;
        const bar = el('path', {
          d: topRoundedPath(bx, by, barW, h, 4),
          fill: t.seq[Math.min(i, t.seq.length - 1)],
        });
        bar.style.cursor = 'default';
        svg.appendChild(bar);

        const val = el('text', {
          x: cx(i), y: by - 8, 'text-anchor': 'middle',
          fill: t.ink3, 'font-size': 11, 'font-weight': 600, 'font-family': 'var(--font-num)',
        });
        val.textContent = FMT.compact(d.value);
        svg.appendChild(val);

        const lab = el('text', {
          x: cx(i), y: pad.t + ih + 16, 'text-anchor': 'middle',
          fill: t.ink4, 'font-size': 11, 'font-family': 'var(--font-num)',
        });
        lab.textContent = d.short || d.label;
        svg.appendChild(lab);

        const cnt = el('text', {
          x: cx(i), y: pad.t + ih + 30, 'text-anchor': 'middle',
          fill: t.ink4, 'font-size': 10, 'font-family': 'var(--font-num)',
        });
        cnt.textContent = `${d.count} faktur`;
        svg.appendChild(cnt);

        /* Target sentuh lebih besar dari marka. */
        const hit = el('rect', { x: cx(i) - band / 2, y: pad.t, width: band, height: ih, fill: 'transparent' });
        hit.addEventListener('pointerenter', () => {
          bar.setAttribute('opacity', 0.82);
          tip.innerHTML =
            `<div class="chart-tip-head">${d.label}</div>` +
            `<div class="chart-tip-row"><span>Nilai</span><b>${FMT.rpCompact(d.value)}</b></div>` +
            `<div class="chart-tip-row"><span>Jumlah faktur</span><b>${FMT.int(d.count)}</b></div>`;
          tip.dataset.show = 'true';
          placeTip(container, tip, cx(i), by);
        });
        hit.addEventListener('pointerleave', () => {
          bar.removeAttribute('opacity');
          tip.dataset.show = 'false';
        });
        svg.appendChild(hit);
      });

      container.textContent = '';
      container.appendChild(svg);
      ensureTip(container);
    };

    return register(container, draw);
  }

  /* --- Batang horizontal, satu rona (peringkat satu ukuran) ---------------- */
  function rankBars(container, opts) {
    const draw = () => {
      const t = theme();
      const items = opts.items;
      const max = Math.max(...items.map((d) => d.value));
      container.textContent = '';
      const list = document.createElement('div');
      list.className = 'stack-legend';
      list.setAttribute('role', 'list');

      items.forEach((d) => {
        const row = document.createElement('div');
        row.className = 'stack-legend-row';
        row.setAttribute('role', 'listitem');
        row.innerHTML =
          `<span class="stack-name">${d.label}</span>` +
          `<span class="meter" style="flex:0 0 42%">` +
            `<span class="meter-track" style="height:8px">` +
              `<span class="meter-fill" style="width:${(d.value / max) * 100}%;background:${t.cat[0]};border-radius:0 3px 3px 0"></span>` +
            `</span>` +
          `</span>` +
          `<b class="num">${FMT.rpCompact(d.value)}</b>`;
        list.appendChild(row);
      });
      container.appendChild(list);
    };
    return register(container, draw);
  }

  /* --- Bilah komposisi bertumpuk (identitas -> palet kategorikal) --------- */
  function compositionBar(barEl, legendEl, opts) {
    const draw = () => {
      const t = theme();
      const items = opts.items;
      const total = items.reduce((s, d) => s + d.value, 0);

      barEl.textContent = '';
      barEl.className = 'stackbar';
      barEl.setAttribute('role', 'img');
      barEl.setAttribute('aria-label',
        `${opts.title}: ` + items.map((d) => `${d.label} ${FMT.pct((d.value / total) * 100)}`).join(', '));

      const tipHost = barEl.parentElement;
      const tip = ensureTip(tipHost);

      items.forEach((d, i) => {
        const seg = document.createElement('div');
        seg.className = 'stackbar-seg';
        seg.style.flex = `${d.value} 0 0`;
        seg.style.background = t.cat[i % t.cat.length];
        seg.addEventListener('pointerenter', (ev) => {
          const hostRect = tipHost.getBoundingClientRect();
          const r = seg.getBoundingClientRect();
          tip.innerHTML =
            `<div class="chart-tip-head">${d.label}</div>` +
            `<div class="chart-tip-row"><i class="chart-swatch" style="background:${t.cat[i % t.cat.length]}"></i><span>Nilai</span><b>${FMT.rpCompact(d.value)}</b></div>` +
            `<div class="chart-tip-row"><span>Porsi</span><b>${FMT.pct((d.value / total) * 100)}</b></div>`;
          tip.dataset.show = 'true';
          placeTip(tipHost, tip, r.left - hostRect.left + r.width / 2, r.top - hostRect.top);
        });
        seg.addEventListener('pointerleave', () => { tip.dataset.show = 'false'; });
        barEl.appendChild(seg);
      });

      if (legendEl) {
        legendEl.textContent = '';
        legendEl.className = 'stack-legend';
        items.forEach((d, i) => {
          const row = document.createElement('div');
          row.className = 'stack-legend-row';
          row.innerHTML =
            `<i class="chart-swatch" style="background:${t.cat[i % t.cat.length]}"></i>` +
            `<span class="stack-name">${d.label}</span>` +
            `<b class="num">${FMT.rpCompact(d.value)}</b>` +
            `<span class="stack-share num">${FMT.pct((d.value / total) * 100)}</span>`;
          legendEl.appendChild(row);
        });
      }
    };
    return register(barEl, draw);
  }

  /* --- Sparkline untuk ubin KPI ------------------------------------------- */
  function sparkline(container, values) {
    const draw = () => {
      const t = theme();
      const W = 80, H = 28, pad = 3;
      const min = Math.min(...values), max = Math.max(...values);
      const span = max - min || 1;
      const x = (i) => pad + (i / (values.length - 1)) * (W - pad * 2);
      const y = (v) => H - pad - ((v - min) / span) * (H - pad * 2);

      const svg = el('svg', { class: 'chart-svg', viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true', focusable: 'false' });
      const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');

      svg.appendChild(el('path', {
        d: `${d} L${x(values.length - 1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`,
        fill: t.cat[0], opacity: 0.12, stroke: 'none',
      }));
      svg.appendChild(el('path', {
        d, fill: 'none', stroke: t.cat[0], 'stroke-width': 1.5,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));
      svg.appendChild(el('circle', {
        cx: x(values.length - 1), cy: y(values[values.length - 1]), r: 2.75,
        fill: t.cat[0], stroke: t.surface, 'stroke-width': 1.5,
      }));

      container.textContent = '';
      container.appendChild(svg);
    };
    return register(container, draw);
  }

  /* --- Registri: gambar ulang saat lebar atau tema berubah ---------------- */
  function register(node, draw) {
    const entry = { node, draw };
    registry.add(entry);
    draw();
    if (typeof ResizeObserver !== 'undefined') {
      let last = node.clientWidth;
      const ro = new ResizeObserver(() => {
        if (node.clientWidth !== last && node.clientWidth > 0) { last = node.clientWidth; draw(); }
      });
      ro.observe(node);
      entry.ro = ro;
    }
    return entry;
  }

  function redrawAll() {
    for (const entry of registry) {
      if (!entry.node.isConnected) { entry.ro?.disconnect(); registry.delete(entry); continue; }
      entry.draw();
    }
  }

  /** Buang instans yang nodenya sudah lepas dari dokumen. */
  function prune() {
    for (const entry of registry) {
      if (!entry.node.isConnected) { entry.ro?.disconnect(); registry.delete(entry); }
    }
  }

  return { lineChart, columnChart, rankBars, compositionBar, sparkline, redrawAll, prune, cssVar };
})();

      dasbor: { title: 'Dasbor', sub: `Ikhtisar operasi ${DATA.org.company} untuk periode ${DATA.org.period}.` },
