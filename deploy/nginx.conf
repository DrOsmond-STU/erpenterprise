# Reverse proxy TLS untuk ERP Enterprise — ISO 27001 A.8.20–A.8.24.
# Aplikasi mendengarkan di 127.0.0.1:8080; hanya nginx yang terbuka ke jaringan.

limit_req_zone $binary_remote_addr zone=erp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=20r/s;

server {
    listen 80;
    server_name erp.contoh.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.contoh.co.id;

    ssl_certificate     /etc/letsencrypt/live/erp.contoh.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.contoh.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Header keamanan juga dikirim aplikasi; HSTS diletakkan di tepi.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /api/auth/login {
        limit_req zone=erp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=erp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}

# /etc/nginx/proxy_params minimal:
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;   # timpa, jangan tambahkan, agar tidak dapat dipalsukan
#   proxy_set_header X-Forwarded-Proto $scheme;
